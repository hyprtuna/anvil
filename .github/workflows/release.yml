name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# npm publish is intentionally skipped right now.
#
# The unscoped name `anvil` is taken on npm by an unrelated project
# (ademfox/anvil, last publish 2022-04, ~4 years stale). Rather than
# squat-dispute it, Anvil's primary distribution is `install.sh` —
# see docs/installation.md and docs/getting-started.md. When we're
# ready to ship to npm, we'll publish under the scoped name
# `@hyprtuna/anvil`.
#
# To re-enable publishing:
#   1. Change `name` in package.json and marketplace.json to
#      `@hyprtuna/anvil`.
#   2. Set the `NPM_TOKEN` repo secret (npm automation token).
#   3. Re-add the publish step below:
#        - name: Publish to npm registry (via bun)
#          run: bun publish --access public
#          env:
#            NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
#
# Bun 1.3 does not yet support `--provenance` (Sigstore signing).
# If provenance becomes a hard requirement, swap to
# `npm publish --provenance --access public` with setup-node@v5.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Extract changelog entry
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$TAG_VERSION" '/^## \[/ { if (p) exit; if (index($0, "["ver"]")) { p=1; next } } p { print }' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
