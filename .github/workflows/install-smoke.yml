name: install-smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: chmod +x scripts/smoke-install.sh install.sh uninstall.sh
      - run: ./scripts/smoke-install.sh
